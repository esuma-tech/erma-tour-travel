{% extends "base.html" %}
{% block title %}Log In | Historical Ethiopia Tours{% endblock %}
{% block content %}
<section>
  <div class="container" style="max-width:480px;">
    <div class="panel">
      <h2 class="section-title" style="font-size:1.7rem;">Log In</h2>
      <p class="section-sub">Log in to book your tour.</p>
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <label>Email</label>
        <input type="email" name="email" required />
        <label>Password</label>
        <input type="password" name="password" required />
        <button class="btn" type="submit" style="margin-top:1rem;">Log In</button>
      </form>
      <p style="margin-top:1rem;">New here? <a href="/signup">Create an account</a></p>
    </div>
  </div>
</section>
{% endblock %}
