{% extends "base.html" %}
{% block title %}Sign Up | Historical Ethiopia Tours{% endblock %}
{% block content %}
<section>
  <div class="container" style="max-width:560px;">
    <div class="panel">
      <h2 class="section-title" style="font-size:1.7rem;">Create an Account</h2>
      <p class="section-sub">Sign up to book tours with Historical Ethiopia Tours.</p>
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form method="post" action="/signup">
        <label>Full name</label>
        <input name="full_name" required />
        <div class="row">
          <div><label>Email</label><input type="email" name="email" required /></div>
          <div><label>Phone</label><input name="phone" /></div>
        </div>
        <label>Password</label>
        <input type="password" name="password" minlength="6" required />
        <button class="btn" type="submit" style="margin-top:1rem;">Sign Up & Continue to Booking</button>
      </form>
      <p style="margin-top:1rem;">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </div>
</section>
{% endblock %}
