{% extends "base.html" %}
{% block title %}Admin Login | Erma Tour & Travel{% endblock %}
{% block content %}
<section>
  <div class="container" style="max-width:480px;">
    <div class="panel">
      <h2 class="section-title" style="font-size:1.6rem;">Admin Login</h2>
      <p class="section-sub">Sign in to manage tours, bookings, and inquiries.</p>
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form method="post" action="/admin/login">
        <label>Username</label>
        <input name="username" required />
        <label>Password</label>
        <input type="password" name="password" required />
        <button class="btn" type="submit" style="margin-top:1rem;">Login</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
